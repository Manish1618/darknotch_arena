# Frontend container: serves the website files only. It has no route to the
# API, database or Redis; Caddy sends /api/* to the backend containers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # fonts, images and sounds rarely change; scripts and styles revalidate
    location ~* ^/static/.+\.(woff2|png|svg|ico|mp3)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /static/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # every page is the same app shell; the browser app routes it
    location / {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
